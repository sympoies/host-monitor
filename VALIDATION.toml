# Finish-line validation contract. agent-hook and the agent-runtime-kit
# finish-line hooks block a turn that edited files until these commands pass.

[[validation]]
context = "project-dev"
commands = ["npm ci", "npm run validate"]
marker = ".cache/agent-validation/project-dev.ok"
description = "Install the pinned dev dependencies, then run the repository-owned source validation: strict type checking, shell syntax, the browser build, and all deterministic tests."
