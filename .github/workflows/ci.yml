name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Dev dependencies (TypeScript, Node types) type-check the code and emit the browser app; the artifact has none.
      - run: npm ci
      - run: npm run validate
      # A clean checkout must build an artifact that passes admission.
      - name: build and verify artifact
        run: |
          built=$(node scripts/build-artifact.ts "$RUNNER_TEMP/artifact")
          hash=$(node -e 'console.log(JSON.parse(process.argv[1]).artifact)' "$built")
          node scripts/verify-artifact.mts "$RUNNER_TEMP/artifact" "$hash"
