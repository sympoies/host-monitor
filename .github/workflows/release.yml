name: release

# Pushing tag v<package.json version> publishes the pinnable release assets.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm run validate
      - name: package release assets
        id: package
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          summary=$(scripts/package-release.sh "$RUNNER_TEMP/release" "$GITHUB_REF_NAME")
          echo "artifact=$(node -e 'console.log(JSON.parse(process.argv[1]).artifact)' "$summary")" >>"$GITHUB_OUTPUT"
          echo "tarball=$(node -e 'console.log(JSON.parse(process.argv[1]).tarball)' "$summary")" >>"$GITHUB_OUTPUT"
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Artifact id: \`$ARTIFACT\`"
            echo
            echo "Install by downloading \`$TARBALL\`, \`verify-artifact.mjs\`, \`install-release.sh\`, \`artifact-id\` and \`SHA256SUMS\`, then running \`sha256sum --check --strict SHA256SUMS\`, extracting the tarball, verifying it with \`node verify-artifact.mjs <dir> $ARTIFACT\`, and installing with \`install-release.sh\`. See DEVELOPMENT.md."
            echo
            echo '```'
            cat "$RUNNER_TEMP/release/SHA256SUMS"
            echo '```'
          } >"$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" "$RUNNER_TEMP/release"/*
