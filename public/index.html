<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Host Monitor · 主機狀態</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><div class="brand"><span class="mark">H</span><div><h1>Host Monitor</h1><p>主機資源與服務狀態</p></div></div><div class="update"><span id="updated">取得主機資料中</span><button id="refresh">重新整理</button></div></header><main><section class="fleet" aria-label="主機選擇" id="hosts"></section><div id="connection" role="status"></div><section class="section-head"><div><p class="eyebrow">需要關注</p><h2 id="host-title">正在讀取主機</h2></div><span id="summary" class="pill"></span></section><section id="attention" class="attention" aria-live="polite"></section><section id="resources" class="resources" aria-label="硬體資源"></section><section class="panel"><div class="panel-head"><div><h2>磁碟容量</h2><p>主機檔案系統的使用量與剩餘空間</p></div></div><div id="disks" class="disk-list"></div></section><section class="panel"><div class="panel-head"><div><h2>服務</h2><p id="service-count">主機服務與容器</p></div><div class="filters"><input id="search" type="search" placeholder="搜尋服務名稱" aria-label="搜尋服務"><select id="filter" aria-label="服務篩選"><option value="important">主要服務</option><option value="attention">需要關注</option><option value="running">執行中</option><option value="all">全部已安裝服務</option></select></div></div><div class="table-wrap"><table><thead><tr><th>服務</th><th>狀態</th><th>來源</th><th>啟動方式 / 詳細狀態</th></tr></thead><tbody id="services"></tbody></table></div><p id="empty" class="empty" hidden>沒有符合條件的服務</p></section><section class="panel"><div class="panel-head"><div><h2>功能檢查與最近錯誤</h2><p>功能檢查顯示實際端點回應；journal 顯示近一小時錯誤數量</p></div></div><div id="checks" class="checks"></div></section><footer>每台主機各自提供資源與服務資訊 · 自動更新 · 服務待命不等於故障</footer></main></body></html>
