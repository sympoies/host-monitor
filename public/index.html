<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="title">Host Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 12h4l2.5-6 4 12 2.5-6H21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><h1>Host Monitor</h1><p data-i18n="brand.tagline"></p></div>
      </div>
      <div class="update"><span id="updated" data-i18n="updated.loading"></span><button id="refresh" data-i18n="refresh"></button><button id="language" type="button" data-i18n="lang.other" data-i18n-label="lang.switch"></button></div>
    </div>
  </header>
  <main>
    <div id="host-filters" class="filter-tabs fleet-filters" hidden></div>
    <section class="fleet" data-i18n-label="hosts.label" id="hosts"></section>
    <div class="fleet-tools"><button id="reset-order" type="button" data-i18n="hosts.reset" hidden></button></div>
    <div id="connection" role="status"></div>
    <section class="section-head">
      <div><p class="eyebrow" data-i18n="detail.eyebrow"></p><h2 id="host-title" data-i18n="detail.loading"></h2></div>
      <span id="summary" class="pill"></span>
    </section>
    <section id="attention" class="attention" aria-live="polite"></section>
    <section id="resource-panel" class="panel" data-i18n-label="panel.resources">
      <h2 class="visually-hidden" data-i18n="panel.resources"></h2><div id="resources" class="resources" data-i18n-label="resources.label"></div>
    </section>
    <div class="tab-tools">
      <div id="host-tabs" class="host-tabs" role="tablist" data-i18n-label="tabs.label"></div>
      <details class="tab-order-menu">
        <summary data-i18n="tabs.orderMenu"></summary>
        <div class="tab-order-actions">
          <button id="move-tab-left" type="button" data-i18n="tabs.moveLeft" data-i18n-label="tabs.moveLeftLabel"></button>
          <button id="move-tab-right" type="button" data-i18n="tabs.moveRight" data-i18n-label="tabs.moveRightLabel"></button>
          <button id="reset-tab-order" type="button" data-i18n="tabs.reset" data-i18n-label="tabs.reset"></button>
        </div>
      </details>
    </div>
    <section id="disk-panel" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-disks" tabindex="0">
      <div class="panel-head"><div><h2 data-i18n="tab.disks"></h2><p data-i18n="disks.desc"></p></div></div>
      <div id="disk-filters" class="filter-tabs section-filters" hidden></div><div id="disks" class="disk-list"></div>
    </section>
    <section id="checks-panel" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-checks" tabindex="0">
      <div class="panel-head"><div><h2 data-i18n="tab.checks"></h2><p data-i18n="checks.desc"></p></div></div>
      <div id="checks-filters" class="filter-tabs section-filters" hidden></div><div id="checks" class="checks"></div>
    </section>
    <section id="events-panel" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-events" tabindex="0">
      <div class="panel-head"><div><h2 data-i18n="tab.events"></h2><p data-i18n="events.desc"></p></div></div>
      <div id="events-filters" class="filter-tabs section-filters" hidden></div><div id="events" class="events"></div>
    </section>
    <section id="agents-panel" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-agents" tabindex="0">
      <div class="panel-head"><div><h2 data-i18n="tab.agents"></h2><p data-i18n="agents.desc"></p></div></div>
      <div class="session-tools"><button id="toggle-session-details" type="button" data-i18n="sessions.collapseAll" hidden></button></div>
      <div id="agent-session-filters" class="filter-tabs section-filters" role="tablist" data-i18n-label="filters.sessions"></div>
      <div id="agent-sessions" class="agent-sessions"></div>
    </section>
    <section id="services-panel" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-services" tabindex="0">
      <div class="panel-head">
        <div><h2 data-i18n="tab.services"></h2><p id="service-count" data-i18n="services.desc"></p></div>
        <div class="filters"><input id="search" type="search" data-i18n-placeholder="services.searchPlaceholder" data-i18n-label="services.searchLabel"><select id="filter" data-i18n-label="services.filterLabel"><option value="all" data-i18n="services.optionAll"></option><option value="important" data-i18n="services.optionImportant"></option><option value="attention" data-i18n="services.optionAttention"></option><option value="running" data-i18n="services.optionRunning"></option></select></div>
      </div>
      <div id="service-filters" class="filter-tabs section-filters" hidden></div>
      <div class="table-wrap"><table><thead><tr><th data-i18n="services.colService"></th><th data-i18n="services.colState"></th><th data-i18n="services.colSource"></th><th data-i18n="services.colDetails"></th></tr></thead><tbody id="services"></tbody></table></div>
      <p id="empty" class="empty" data-i18n="services.empty" hidden></p>
      <section id="log-panel" class="log-panel" data-i18n-label="log.panel" hidden>
        <div class="panel-head"><div><h2 id="log-title" data-i18n="log.panel"></h2><p data-i18n="log.desc"></p></div><div class="log-actions"><button id="log-refresh" type="button" data-i18n="log.refresh"></button><button id="log-close" type="button" data-i18n="log.close"></button></div></div>
        <pre id="log-body" class="log-body"></pre>
      </section>
    </section>
    <footer data-i18n="footer"></footer>
  </main>
</body>
</html>
